name: Update profile art

# Refreshes the contribution graph and stats card SVGs daily from real data.
# Runs on a daily cron, on every push to main, and on demand.

"on":
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write

env:
  GH_PROFILE_USER: guisilva10

jobs:
  profile-art:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r scripts/requirements.txt

      - name: Scrape contribution data (no auth needed)
        run: python scripts/fetch_contributions.py

      - name: Render animated contribution graph
        run: python scripts/render_heatmap_svg.py

      - name: Render streak / numbers card
        run: python scripts/render_stats_svg.py

      - name: Commit updated art
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh profile art [skip ci]"
          file_pattern: "data/contributions.json contrib-heatmap.svg stats.svg"
